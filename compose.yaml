services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: frets
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      AUTH_DB_PASSWORD: ${AUTH_DB_PASSWORD:?Set AUTH_DB_PASSWORD}
      LIBRARY_DB_PASSWORD: ${LIBRARY_DB_PASSWORD:?Set LIBRARY_DB_PASSWORD}
    volumes:
      - postgres:/var/lib/postgresql/data
      - ./deploy/postgres/init-roles.sh:/docker-entrypoint-initdb.d/01-roles.sh:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -h 127.0.0.1 -U postgres -d frets']
      interval: 2s
      timeout: 3s
      retries: 20

  auth:
    build:
      context: .
      dockerfile: deploy/Dockerfile
      args:
        SERVICE: auth
    restart: unless-stopped
    stop_grace_period: 15s
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: ${AUTH_DATABASE_URL:-postgres://frets_auth:${AUTH_DB_PASSWORD}@postgres:5432/frets?sslmode=disable}
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:-http://localhost:6666}
      INTERNAL_SECRET: ${INTERNAL_SECRET:?Set INTERNAL_SECRET}
      LOCAL_LOGIN: ${LOCAL_LOGIN:-false}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      YANDEX_CLIENT_ID: ${YANDEX_CLIENT_ID:-}
      YANDEX_CLIENT_SECRET: ${YANDEX_CLIENT_SECRET:-}

  song-library:
    build:
      context: .
      dockerfile: deploy/Dockerfile
      args:
        SERVICE: song-library
    restart: unless-stopped
    stop_grace_period: 15s
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: ${LIBRARY_DATABASE_URL:-postgres://frets_library:${LIBRARY_DB_PASSWORD}@postgres:5432/frets?sslmode=disable}
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:-http://localhost:6666}
      INTERNAL_SECRET: ${INTERNAL_SECRET:?Set INTERNAL_SECRET}
      AUTH_URL: ${AUTH_URL:-http://auth:8080}
      FILE_DIR: /data/files
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      S3_REGION: ${S3_REGION:-}
      S3_BUCKET: ${S3_BUCKET:-}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-}
      S3_SESSION_TOKEN: ${S3_SESSION_TOKEN:-}
      S3_INSECURE: ${S3_INSECURE:-false}
    volumes:
      - files:/data/files

  nginx:
    image: nginx:alpine
    depends_on:
      - auth
      - song-library
    ports:
      - '127.0.0.1:6666:8080'
    volumes:
      - ./deploy/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro

volumes:
  postgres:
  files:

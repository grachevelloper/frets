log_format frets '$remote_addr - $remote_user [$time_local] '
                 '"$request_method $uri $server_protocol" $status $body_bytes_sent';

server {
    listen 8080;
    server_name _;

    client_max_body_size 17m;
    server_tokens off;
    gzip on;
    gzip_vary on;
    gzip_types text/css application/javascript;
    access_log /var/log/nginx/access.log frets;

    # Resolve container addresses again after service replacement.
    resolver 127.0.0.11 valid=5s ipv6=off;
    set $auth http://auth:8080;
    set $library http://song-library:8080;

    proxy_intercept_errors off;
    error_page 502 504 = @unavailable;
    error_page 413 = @too_large;

    location /api/v1/auth/callback/ {
        error_log /dev/null;
        proxy_pass $auth;
    }
    location /api/v1/auth/ { proxy_pass $auth; }
    location = /api/v1/me { proxy_pass $auth; }
    location = /api/v1/songs { proxy_pass $library; }
    location /api/v1/songs/ { proxy_pass $library; }

    location @unavailable {
        default_type application/json;
        add_header Cache-Control no-store always;
        return 503 '{"code":"unavailable"}';
    }

    location @too_large {
        default_type application/json;
        add_header Cache-Control no-store always;
        return 413 '{"code":"file_too_large"}';
    }

    root /usr/share/nginx/html;

    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location /api/ {
        default_type application/json;
        return 404 '{"code":"not_found"}';
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location / {
        try_files $uri /index.html;
    }
}
